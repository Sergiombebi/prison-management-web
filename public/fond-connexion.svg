<?xml version="1.0" encoding="UTF-8"?>
<!--
  Fond de l'écran de connexion — illustration vectorielle originale.
  Un palais de justice au crépuscule : registre institutionnel, traité en
  silhouettes plates pour rester lisible sous le dégradé et peser quelques Ko.
  Aucune requête réseau, aucun texte : la typographie reste dans la page.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"
     preserveAspectRatio="xMidYMid slice" role="img" aria-label="Palais de justice au crépuscule">
  <defs>
    <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0527" />
      <stop offset="0.45" stop-color="#1d0b50" />
      <stop offset="0.78" stop-color="#3b1a8d" />
      <stop offset="1" stop-color="#6034c9" />
    </linearGradient>
    <radialGradient id="lueur" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8f6bff" stop-opacity="0.62" />
      <stop offset="0.55" stop-color="#6c3fed" stop-opacity="0.22" />
      <stop offset="1" stop-color="#6c3fed" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="aurore" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38a8e8" stop-opacity="0.34" />
      <stop offset="1" stop-color="#38a8e8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="brume" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a52e0" stop-opacity="0" />
      <stop offset="1" stop-color="#8a63ef" stop-opacity="0.30" />
    </linearGradient>
    <linearGradient id="parvis" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#160a3a" />
      <stop offset="1" stop-color="#0a0320" />
    </linearGradient>
    <linearGradient id="facade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1372" />
      <stop offset="1" stop-color="#160a44" />
    </linearGradient>
  </defs>

  <!-- Ciel -->
  <rect width="1600" height="900" fill="url(#ciel)" />
  <ellipse cx="1180" cy="250" rx="520" ry="420" fill="url(#lueur)" />
  <ellipse cx="300" cy="180" rx="460" ry="300" fill="url(#aurore)" />

  <!-- Étoiles — la constellation reste discrète, c'est une texture -->
  <g fill="#ffffff">
    <circle cx="180" cy="96" r="1.8" opacity="0.55" />
    <circle cx="352" cy="58" r="1.2" opacity="0.4" />
    <circle cx="486" cy="140" r="1.6" opacity="0.5" />
    <circle cx="640" cy="72" r="1.1" opacity="0.35" />
    <circle cx="812" cy="126" r="1.7" opacity="0.45" />
    <circle cx="968" cy="62" r="1.3" opacity="0.4" />
    <circle cx="1124" cy="150" r="1.5" opacity="0.38" />
    <circle cx="1298" cy="88" r="1.9" opacity="0.5" />
    <circle cx="1452" cy="168" r="1.2" opacity="0.35" />
    <circle cx="1536" cy="60" r="1.6" opacity="0.45" />
    <circle cx="92" cy="220" r="1.3" opacity="0.3" />
    <circle cx="726" cy="196" r="1.1" opacity="0.28" />
  </g>

  <!-- Reliefs lointains -->
  <path d="M0 640 L0 566 Q150 498 302 544 Q430 584 524 548 Q646 502 764 556 Q902 612 1046 558 Q1188 506 1326 550 Q1466 592 1600 552 L1600 640 Z"
        fill="#24105c" opacity="0.85" />
  <path d="M0 640 L0 608 Q190 566 356 600 Q520 632 690 598 Q860 562 1030 604 Q1210 648 1380 606 Q1500 578 1600 596 L1600 640 Z"
        fill="#1b0b48" />
  <rect x="0" y="470" width="1600" height="190" fill="url(#brume)" opacity="0.7" />

  <!-- Enceinte : un mur ponctué de pilastres, de part et d'autre du bâtiment -->
  <g fill="#150839">
    <rect x="0" y="602" width="392" height="44" />
    <rect x="1208" y="602" width="392" height="44" />
  </g>
  <g fill="#1f0c53">
    <rect x="24" y="590" width="14" height="56" /><rect x="108" y="590" width="14" height="56" />
    <rect x="192" y="590" width="14" height="56" /><rect x="276" y="590" width="14" height="56" />
    <rect x="360" y="590" width="14" height="56" /><rect x="1234" y="590" width="14" height="56" />
    <rect x="1318" y="590" width="14" height="56" /><rect x="1402" y="590" width="14" height="56" />
    <rect x="1486" y="590" width="14" height="56" /><rect x="1570" y="590" width="14" height="56" />
  </g>

  <!-- Palais : fronton, colonnade, emmarchement -->
  <path d="M800 284 L1166 442 L434 442 Z" fill="url(#facade)" />
  <path d="M800 284 L1166 442 L434 442 Z" fill="none" stroke="#a487ff" stroke-opacity="0.5" stroke-width="2" />
  <circle cx="800" cy="410" r="16" fill="none" stroke="#9c7dff" stroke-opacity="0.5" stroke-width="2.5" />
  <path d="M800 396 L803.8 406.4 L814.6 406.4 L805.9 413 L809.3 423.6 L800 417.2 L790.7 423.6 L794.1 413 L785.4 406.4 L796.2 406.4 Z"
        fill="#9c7dff" opacity="0.55" />

  <rect x="446" y="442" width="708" height="36" fill="#26116a" />
  <rect x="446" y="474" width="708" height="4" fill="#a487ff" opacity="0.35" />

  <g fill="url(#facade)">
    <rect x="474" y="478" width="38" height="126" /><rect x="566" y="478" width="38" height="126" />
    <rect x="658" y="478" width="38" height="126" /><rect x="750" y="478" width="38" height="126" />
    <rect x="842" y="478" width="38" height="126" /><rect x="934" y="478" width="38" height="126" />
    <rect x="1026" y="478" width="38" height="126" /><rect x="1088" y="478" width="38" height="126" />
  </g>
  <g fill="#b49bff" opacity="0.26">
    <rect x="474" y="478" width="4" height="126" /><rect x="566" y="478" width="4" height="126" />
    <rect x="658" y="478" width="4" height="126" /><rect x="750" y="478" width="4" height="126" />
    <rect x="842" y="478" width="4" height="126" /><rect x="934" y="478" width="4" height="126" />
    <rect x="1026" y="478" width="4" height="126" /><rect x="1088" y="478" width="4" height="126" />
  </g>

  <!-- Portail central : la seule ouverture éclairée de la façade -->
  <path d="M770 604 L770 522 Q800 496 830 522 L830 604 Z" fill="#6f45d8" opacity="0.72" />
  <path d="M770 604 L770 522 Q800 496 830 522 L830 604 Z" fill="none" stroke="#b49bff" stroke-opacity="0.45" stroke-width="2" />

  <g fill="#1b0b4e">
    <rect x="446" y="604" width="708" height="26" />
    <rect x="418" y="630" width="764" height="16" />
    <rect x="390" y="646" width="820" height="16" />
    <rect x="362" y="662" width="876" height="18" />
  </g>

  <!-- Parvis -->
  <rect x="0" y="680" width="1600" height="220" fill="url(#parvis)" />
  <g stroke="#7d59f0" stroke-opacity="0.12" stroke-width="1.5">
    <path d="M800 680 L360 900" /><path d="M800 680 L560 900" /><path d="M800 680 L720 900" />
    <path d="M800 680 L880 900" /><path d="M800 680 L1040 900" /><path d="M800 680 L1240 900" />
  </g>
  <g stroke="#7d59f0" stroke-opacity="0.09" stroke-width="1.5">
    <path d="M0 724 H1600" /><path d="M0 782 H1600" /><path d="M0 850 H1600" />
  </g>
</svg>
